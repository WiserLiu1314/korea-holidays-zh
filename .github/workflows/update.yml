name: 更新中文韩国假日日历

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'data/**'
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: korean-holiday-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 验证生成逻辑
        run: python -m unittest discover -s tests -v
      - name: 获取最新公休日并生成日历
        run: python scripts/update_calendar.py
      - name: 保存数据与每日核对记录
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh Korean holidays and daily verification [skip ci]'
            git push origin HEAD:main
          fi
      - name: 上传网页与日历
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: 更新摘要
        run: |
          echo '中文日历已生成并提交。' >> "$GITHUB_STEP_SUMMARY"
          echo '备用订阅：https://raw.githubusercontent.com/WiserLiu1314/korea-holidays-zh/main/docs/korea-zh.ics' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检查 Pages 设置
        uses: actions/configure-pages@v5
      - name: 发布网页与订阅文件
        id: deployment
        uses: actions/deploy-pages@v4
